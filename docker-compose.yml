version: '3.8'
services:
  seekrss:
    build: .
    image: seekrss:local
    container_name: seekrss
    restart: unless-stopped
    init: true
    # Copy to gitignored docker-compose.local.yml; replace xxx with your own password.
    # Compose requires $$ for each literal $ in this argument. No shell is used.
    command: ["bun", "run", "dist/server.js", "-pwd=xxx"]
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${WEB_PORT:-3010}:3010"
    environment:
      NODE_ENV: production

      SECRET_KEY: '${SECRET_KEY:-}'
      HOST: 0.0.0.0
      PORT: '3010'
      DATABASE_PATH: /app/data/seekrss.db
      COOKIE_SECURE: '${COOKIE_SECURE:-false}'
      PUBLIC_ORIGIN: '${PUBLIC_ORIGIN:-}'
    volumes:
      - seekrss_data:/app/data
    read_only: true
    tmpfs:
      - /tmp:size=32m,noexec,nosuid
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    stop_grace_period: 30s
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'
volumes:
  seekrss_data:
